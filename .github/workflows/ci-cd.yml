name: CI/CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /root/SafariAll

            # Verify production environment exists
            if [ ! -f .env ]; then
              echo "ERROR: Production .env is missing!"
              exit 1
            fi

            echo "Backing up production environment..."
            cp -p .env /tmp/SafariAll.production.env

            echo "Pulling latest code..."
            git fetch origin
            git checkout master
            git reset --hard origin/master

            # Restore environment file
            cp -p /tmp/SafariAll.production.env .env
            rm -f /tmp/SafariAll.production.env

            echo "Building Docker images..."
            docker compose build --no-cache

            echo "Restarting containers..."
            docker compose up -d --force-recreate

            echo "Waiting for containers and database migrations to complete..."
            sleep 15

            echo "Deployment completed!"
            docker compose ps

            docker system prune -f
