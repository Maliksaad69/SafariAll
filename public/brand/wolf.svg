  <polygon points="7.8,12.4 9.6,12.7 8.7,13.3" fill="#FFFBEB" />

  <polygon points="16.8,12.2 13.8,12.6 15.5,13.6" fill="#0E1F1E" />
  <polygon points="16.2,12.4 14.4,12.7 15.3,13.3" fill="#FFFBEB" />

