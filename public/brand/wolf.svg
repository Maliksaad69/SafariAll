  <path d="M1.5 14L4 18L7.5 16.5L6 14.5L1.5 14Z" fill="url(#wolfGoldGrad)" opacity="0.75" />

  <!-- Cheek Tufts Right -->
  <path d="M20.5 10.5L22.5 14L18 14.5L16.5 12.5L20.5 10.5Z" fill="url(#wolfGoldGrad)" opacity="0.85" />
  <path d="M22.5 14L20 18L16.5 16.5L18 14.5L22.5 14Z" fill="url(#wolfGoldGrad)" opacity="0.75" />

  <!-- Eyes - Keen Alpha Slits -->
