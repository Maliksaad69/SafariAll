<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wolfGoldGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#926F28" />
    </linearGradient>
    <linearGradient id="wolfGoldLight" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#E4C176" />
    </linearGradient>
  </defs>

  <!-- Left Ear -->
  <path d="M4 2.5L9 8L3.5 10.5L4 2.5Z" fill="url(#wolfGoldGrad)" />
  <path d="M5 4.5L8.2 8L4.8 9.5L5 4.5Z" fill="url(#wolfGoldLight)" opacity="0.9" />

  <!-- Right Ear -->
