services:
  # 1. Self-Hosted PostgreSQL Database (PostgreSQL 17, pre-loaded with the app data)
  postgres:
    build: ./docker/postgres
    image: safaribookings-postgres:latest
    container_name: safaribookings_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safari_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SafariSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-safaribookings_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safari_admin} -d ${POSTGRES_DB:-safaribookings_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safari_network

  # 2. Database Management GUI (optional pgAdmin 4 at http://localhost:5050)
  #    Start it with: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: safaribookings_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@safaribookings.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-AdminSafariPass123!}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - safari_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leads-crm-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env   
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - safari_network

volumes:
  postgres_data:
    driver: local
  pgdata:
    driver: local

networks:
  safari_network:
    driver: bridge
